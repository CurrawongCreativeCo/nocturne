<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="600" height="450"><style>
:root{--bg:#f6f6f8;--fg:#1f2430;--line:#c9ccd4;--accent:#5f2bd4}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#e8eaee;--line:#3a3f4b;--accent:#9f80e5}}
rect.bg{fill:var(--bg)}
.h{fill:var(--fg);opacity:.85}.l{fill:var(--fg);opacity:.35}.a{fill:var(--accent)}
.f{fill:none;stroke:var(--fg);stroke-opacity:.4}.p{fill:var(--fg);fill-opacity:.1;stroke:var(--fg);stroke-opacity:.4}
.g{fill:var(--fg);opacity:.3}.g2{fill:var(--fg);opacity:.22}.c{fill:var(--fg);fill-opacity:.06;stroke:var(--fg);stroke-opacity:.3}
.s{fill:none;stroke:var(--accent);stroke-width:1.2}.band{fill:var(--accent);opacity:.9}.k{fill:var(--bg)}
text{font:600 8px system-ui,sans-serif;fill:var(--fg);opacity:.6}
</style><rect class="bg" width="160" height="120"/><rect class="h" x="40" y="16" width="80" height="7" rx="2"/><rect class="l" x="52" y="30" width="56" height="3" rx="1.5"/><rect class="c" x="34" y="44" width="92" height="12" rx="3"/><rect class="c" x="34" y="62" width="92" height="12" rx="3"/><rect class="c" x="34" y="80" width="92" height="12" rx="3"/><rect class="a" x="34" y="100" width="36" height="10" rx="5"/></svg>
