<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-label="Proposed Nocturne Studio page editor with clear drafting states and a preview panel">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f1fa"/><stop offset="1" stop-color="#eae6f3"/></linearGradient>
<linearGradient id="preview" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b2d48"/><stop offset=".5" stop-color="#786184"/><stop offset="1" stop-color="#c3b6af"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fefcff"/><stop offset="1" stop-color="#f7f4f9"/></linearGradient>
<filter id="sh"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
