# Weekly dependency PRs, grouped so related packages update together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it: most compromised or broken
    # releases are caught and pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      sanity:
        patterns: ['sanity', '@sanity/*', 'next-sanity']
      next-react:
        patterns:
          ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'eslint-config-next']
      tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
