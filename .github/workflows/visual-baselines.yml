# Regenerates the visual regression baselines on the same Linux runner CI compares them on, for
# anyone without Linux or Docker. Run it from the Actions tab on your branch, download the
# `visual-baselines` artifact into tests/e2e/visual.spec.ts-snapshots/, review the images, commit.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npm run test:e2e:update

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/e2e/visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7
