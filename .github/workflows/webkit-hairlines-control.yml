# One-off control (composable section edges, Task 3): the hairlines spec in WebKit on the pre-Task-1 commit, to
# compare with the Task 3 branch's run. Same runner image, Node from .nvmrc, WebKit build and two workers.
# Lives on a throwaway branch only.
name: WebKit hairlines control

on:
  push:
    branches: [ci/webkit-hairlines-control]

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Versions
        run: |
          . /etc/os-release; echo "$PRETTY_NAME"; node -v
          node -p "require('@playwright/test/package.json').version"
          git rev-parse HEAD | tee versions.txt
      - name: Hairlines spec
        run: npx playwright test -c playwright.webkit.config.ts tests/e2e/section-edge-hairlines.spec.ts --workers=2 --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: hairlines-report.json
      - name: Representative screenshots
        if: always()
        run: npx playwright test -c playwright.webkit.config.ts tests/e2e/zz-control-shots.spec.ts --workers=1 --reporter=list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hairlines-control
          path: |
            playwright-report/
            hairlines-report.json
            control-shots/
          retention-days: 14
