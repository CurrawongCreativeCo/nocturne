# Shared quality gate: the pre-commit hook is opt-in, so this is what every push must pass.
# `check`: types, lint, format, unit tests, generator. `e2e`: the built site in a real browser.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Checks run offline; the Sanity CLI and Next only need some config to load.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Template version matches the changelog
        run: npm run check:version

      - name: CMS brand (studio-brand.json) is valid
        run: npm run check:studio-brand

      - name: Generated design tokens are committed and current
        run: |
          npm run tokens
          git diff --exit-code src/styles/tokens.generated.css src/config/tokens.generated.ts || {
            echo "::error::The generated design token files are stale. Run 'npm run tokens' and commit them."
            exit 1
          }

      - name: Generated Sanity types are committed and current
        run: |
          npm run typegen
          git diff --exit-code src/types/sanity.types.ts || {
            echo "::error::src/types/sanity.types.ts is stale. Run 'npm run typegen' and commit it."
            exit 1
          }

      - name: Next.js route types
        run: npx next typegen

      - name: Typecheck, lint, format, unit tests
        run: npm run check

      # The generator edits several files at marker comments; prove its output still passes
      # every check. Runs on the throwaway CI checkout, so nothing is committed.
      - name: Section generator smoke test
        run: |
          npm run new:section ci-smoke-section
          npx next typegen
          npm run check

      # The feature, document and singleton generators use the same marker approach. The document
      # goes into the new feature (no schema list yet, so it creates and registers one); the
      # singleton goes into an existing feature with a schema list.
      - name: Feature generator smoke test
        run: |
          npm run new:feature ci-smoke-feature
          npx next typegen
          npm run check

      - name: Document generator smoke test
        run: |
          npm run new:document ci-smoke-feature ci-smoke-document
          npx next typegen
          npm run check

      - name: Singleton generator smoke test
        run: |
          npm run new:singleton blog ci-smoke-singleton
          npx next typegen
          npm run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Production build against a fake Content Lake: pages, metadata, redirects, headers,
      # keyboard and mobile navigation, and axe accessibility scans.
      - name: End-to-end tests
        run: npm run test:e2e

      # Lighthouse scores on / and /about against the build Playwright just made. Budgets are in
      # lighthouserc.json; the JavaScript size budget is tests/e2e/performance.spec.ts.
      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 7
