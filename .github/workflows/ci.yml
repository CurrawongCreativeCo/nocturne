# Shared quality gate: the pre-commit hook is opt-in, so this is what every push must pass.
# `check`: types, lint, format, unit tests, generator. `e2e`: the built site in a real browser.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Checks run offline; the Sanity CLI and Next only need some config to load.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Template version matches the changelog
        run: npm run check:version

      - name: CMS brand (studio-brand.json) is valid
        run: npm run check:studio-brand

      - name: Generated design tokens are committed and current
        run: |
          npm run tokens
          git diff --exit-code src/styles/tokens.generated.css src/config/tokens.generated.ts || {
            echo "::error::The generated design token files are stale. Run 'npm run tokens' and commit them."
            exit 1
          }

      - name: Generated Sanity types are committed and current
        run: |
          npm run typegen
          git diff --exit-code src/types/sanity.types.ts || {
            echo "::error::src/types/sanity.types.ts is stale. Run 'npm run typegen' and commit it."
            exit 1
          }

      # `npm run typegen` also rebuilds the Studio's editor guide from docs/editor-guide, the site
      # profile and the schema, so the step above has just regenerated it.
      - name: Editor guide is committed and current
        run: |
          git diff --exit-code src/features/studio/start-here/editor-guide.generated.json || {
            echo "::error::The editor guide is stale. Run 'npm run typegen' and commit src/features/studio/start-here/editor-guide.generated.json."
            exit 1
          }

      - name: Next.js route types
        run: npx next typegen

      - name: Typecheck, lint, format, unit tests
        run: npm run check

  # The generators edit several files at marker comments; prove each one's output still passes every
  # check. A section with variants is a folder (dispatcher plus one component per variant) with the
  # `variant` field; the document goes into the new feature (no schema list yet, so it creates and
  # registers one); the singleton goes into an existing feature with a schema list. One job each, in
  # parallel (they were five steps of about 2.5 minutes in `check`). They run on throwaway checkouts,
  # so nothing is committed.
  generators:
    name: generator (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_SANITY_DATASET: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: section
            command: npm run new:section ci-smoke-section
          - name: section with variants
            command: npm run new:section ci-smoke-variants -- --variants default,wide,compact
          - name: feature
            command: npm run new:feature ci-smoke-feature
          - name: document
            command: |
              npm run new:feature ci-smoke-feature
              npm run new:document ci-smoke-feature ci-smoke-document
          - name: singleton
            command: npm run new:singleton blog ci-smoke-singleton
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate, then run every check
        run: |
          ${{ matrix.command }}
          npx next typegen
          npm run check

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Four shards, each with its own build and fake Content Lake, so the suite runs in parallel
      # instead of as one 20+ minute job. A failure in one shard doesn't hide the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Production build against a fake Content Lake: pages, metadata, redirects, headers,
      # keyboard and mobile navigation, and axe accessibility scans.
      #
      # Only `desktop` and `mobile` are sharded: the isolated projects (their own job below) depend on
      # them, and Playwright keeps a project with its dependencies in one shard, which put every test
      # in shard 1 and none in the others.
      - name: End-to-end tests
        run: npx playwright test --project=desktop --project=mobile --shard=${{ matrix.shard }}/4

      # Lighthouse scores on /, /about, /hero-parts and /links against the build Playwright just made. Budgets are in
      # lighthouserc.json; the JavaScript size budget is tests/e2e/performance.spec.ts.
      # Runs once (shard 1); every shard leaves a build behind.
      - name: Lighthouse CI
        if: matrix.shard == 1
        run: npx lhci autorun

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 7

  # The projects that change the whole site's state (an A/B test, the Studio's brand colours). Each
  # runs alone and in order against its own fake Content Lake; locally playwright.config.ts chains
  # them with `dependencies`, which CI cannot shard.
  e2e-isolated:
    name: e2e (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: A/B tests
        run: npx playwright test --project=experiments --no-deps

      - name: Design settings
        run: npx playwright test --project=design --no-deps

      - name: Design settings (screenshots)
        run: npx playwright test --project=design-visual --no-deps

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-isolated
          path: |
            playwright-report
            test-results
          retention-days: 7
