name: E2E lake capture (manual)

# A manual, one-off capture for the CI investigation of the build's connection resets
# (tests/e2e/diagnostics/README.md). It is OFF by default: it has no push, pull_request or schedule trigger, and
# nothing else sets E2E_DIAGNOSTICS, so the ordinary pipeline is unchanged. It runs the isolated job's own steps, in
# the same order with the same commands, with the diagnostics on, for a commit named exactly, within a fixed time
# limit, and keeps the log whether the run passes or fails.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The exact commit to capture, as a full 40-character SHA (it must contain the diagnostics).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-lake-capture
  cancel-in-progress: false

jobs:
  capture:
    name: e2e (isolated) with diagnostics
    runs-on: ubuntu-latest
    # The whole job, including the steps that keep the log. The capture step has its own, shorter limit so a hang
    # there is stopped while those steps can still run.
    timeout-minutes: 35
    env:
      E2E_DIAGNOSTICS: '1'
      INPUT_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Check the commit input
        run: |
          if ! printf '%s' "$INPUT_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::commit must be a full 40-character lowercase SHA'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Record the exact commit
        run: |
          mkdir -p e2e-capture
          actual="$(git rev-parse HEAD)"
          {
            echo "requested_commit=$INPUT_COMMIT"
            echo "checked_out_commit=$actual"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "runner_os=$RUNNER_OS"
          } | tee e2e-capture/commit.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$actual" != "$INPUT_COMMIT" ]; then
            echo '::error::the checked-out commit is not the one requested'
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The isolated job's projects, in its order. Each runs as in ci.yml (`npx playwright test --project=<name>
      # --no-deps`); the output goes to the screen, the whole kept log and the project's own log through `tee`, and the
      # status of Playwright, not of `tee`, is each project's result. Like the job, it stops at the first failing project.
      #
      # After each project, scripts/e2e-capture-validity.mjs asks whether the diagnostics saw what the lake served: lake
      # requests with no matching client request record are INCOMPLETE INSTRUMENTATION (exit 70), and the capture stops
      # before any further project. Test results (exit-status.txt) and diagnostic validity (diagnostics-validity.txt) are
      # recorded apart. The step exits with the first failing test's status; with passing tests and incomplete
      # instrumentation, with 70, so a capture that cannot tell what it was for does not pass.
      - name: Run the isolated projects with diagnostics
        timeout-minutes: 25
        run: |
          set +e
          set -o pipefail
          mkdir -p e2e-capture e2e-timings
          test_status=0
          invalid=0
          for project in experiments design design-visual panel-palettes nav-submenus blog-card-design button-style footer-divider team-divider; do
            echo "::group::$project"
            E2E_TIMINGS_FILE="e2e-timings/isolated-$project.json" npx playwright test --project="$project" --no-deps 2>&1 | tee -a e2e-capture/playwright.log "e2e-capture/$project.log"
            code="${PIPESTATUS[0]}"
            echo "::endgroup::"
            echo "$project exit=$code" >> e2e-capture/exit-status.txt
            node scripts/e2e-capture-validity.mjs "e2e-capture/$project.log" --project "$project" | tee -a e2e-capture/diagnostics-validity.txt
            validity="${PIPESTATUS[0]}"
            if [ "$validity" -ne 0 ]; then
              invalid="$validity"
              echo "::error::incomplete instrumentation in $project: the lake served requests and no client request was recorded"
            fi
            if [ "$code" -ne 0 ]; then
              test_status="$code"
              break
            fi
            if [ "$invalid" -ne 0 ]; then
              break
            fi
          done
          echo "tests overall exit=$test_status" >> e2e-capture/exit-status.txt
          echo "diagnostics overall exit=$invalid" >> e2e-capture/diagnostics-validity.txt
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          exit "$invalid"

      - name: Pick out the diagnostic lines
        if: always()
        run: |
          mkdir -p e2e-capture
          touch e2e-capture/playwright.log
          grep -h '\[e2e-diag\]' e2e-capture/playwright.log > e2e-capture/e2e-diag-lines.log || true
          {
            echo "diagnostic lines: $(wc -l < e2e-capture/e2e-diag-lines.log)"
            echo "lake requests recorded: $(grep -c '"source":"lake".*"event":"request"' e2e-capture/e2e-diag-lines.log || true)"
            echo "client request records (fetch or node:http): $(grep -cE '"event":"(fetch-request|request-created)"' e2e-capture/e2e-diag-lines.log || true)"
            echo "client request errors (fetch or node:http): $(grep -cE '"event":"(fetch-error|request-error)"' e2e-capture/e2e-diag-lines.log || true)"
            echo "lake connection closes with an error: $(grep -c '"event":"connection-close".*"hadError":true' e2e-capture/e2e-diag-lines.log || true)"
            echo "ECONNRESET in the log: $(grep -c ECONNRESET e2e-capture/playwright.log || true)"
            echo "budget exhausted (limit-reached notices): $(grep -c '"event":"limit-reached"' e2e-capture/e2e-diag-lines.log || true)"
            echo "--- test exit statuses"
            cat e2e-capture/exit-status.txt 2>/dev/null || true
            echo "--- diagnostic validity"
            cat e2e-capture/diagnostics-validity.txt 2>/dev/null || true
          } | tee e2e-capture/counts.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-lake-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-capture
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
